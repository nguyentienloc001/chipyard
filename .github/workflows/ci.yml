name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI_REPO: nguyentienloc001/chipyard

jobs:
  build-and-test:
    if: github.repository == 'nguyentienloc001/chipyard'
    runs-on: ubuntu-latest
    container:
      image: locnguyen96/chipyard-dev:latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config: [ThesisSoC, QuadCoreRing, QuadCoreMeshThesis]
    steps:
      - uses: actions/checkout@v5
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init submodules
        run: |
          git submodule update --init --depth=1 generators/ tools/ sims/firesim

      - name: Build libgloss
        run: |
          git submodule update --init --depth=1 toolchains/libgloss
          source /opt/chipyard-env.sh
          cd toolchains/libgloss
          mkdir -p build && cd build
          ../configure --prefix=$RISCV/riscv64-unknown-elf --host=riscv64-unknown-elf
          make -j$(nproc)

      - name: Build benchmark firmware
        run: |
          source /opt/chipyard-env.sh
          make -C demoriscv/software/Benchmark clean all

      - name: Generate Verilog for ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} verilog

      - name: Build Verilator simulator for ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }}

      - name: Run bench_matmul_scale on ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} \
            BINARY=$GITHUB_WORKSPACE/demoriscv/software/Benchmark/build/bench_matmul_scale.elf \
            TIMEOUT_CYCLES=500000000 run-binary

      - name: Run bench_pingpong on ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} \
            BINARY=$GITHUB_WORKSPACE/demoriscv/software/Benchmark/build/bench_pingpong.elf \
            TIMEOUT_CYCLES=500000000 run-binary

      - name: Run bench_mem_latency on ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} \
            BINARY=$GITHUB_WORKSPACE/demoriscv/software/Benchmark/build/bench_mem_latency.elf \
            TIMEOUT_CYCLES=500000000 run-binary

      - name: Run bench_mem_bandwidth on ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} \
            BINARY=$GITHUB_WORKSPACE/demoriscv/software/Benchmark/build/bench_mem_bandwidth.elf \
            TIMEOUT_CYCLES=500000000 run-binary

      - name: Collect results
        if: always()
        run: |
          echo "=== Results for ${{ matrix.config }} ==="
          for f in sims/verilator/output/chipyard.harness.TestHarness.${{ matrix.config }}/*.log; do
            echo "--- $(basename $f) ---"
            cat "$f"
            echo
          done

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.config }}-${{ github.sha }}
          path: |
            sims/verilator/output/chipyard.harness.TestHarness.${{ matrix.config }}/*.log
            sims/verilator/output/chipyard.harness.TestHarness.${{ matrix.config }}/*.out
          retention-days: 30
