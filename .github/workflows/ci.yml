name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI_REPO: nguyentienloc001/chipyard

jobs:
  build:
    if: github.repository == 'nguyentienloc001/chipyard'
    runs-on: ubuntu-latest
    container:
      image: locnguyen96/chipyard-dev:latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config: [ThesisSoC, QuadCoreRing, QuadCoreMeshThesis]
    steps:
      - uses: actions/checkout@v5
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init submodules
        run: |
          git submodule update --init --depth=1 generators/ tools/ sims/firesim

      - name: Build libgloss
        run: |
          git submodule update --init --depth=1 toolchains/libgloss
          source /opt/chipyard-env.sh
          cd toolchains/libgloss
          mkdir -p build && cd build
          ../configure --prefix=$RISCV/riscv64-unknown-elf --host=riscv64-unknown-elf
          make -j$(nproc)

      - name: Build benchmark firmware
        run: |
          source /opt/chipyard-env.sh
          make -C demoriscv/software/Benchmark clean all

      - name: Generate Verilog and build simulator for ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }}

      - name: Upload simulator and firmware
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.config }}-${{ github.sha }}
          path: |
            sims/verilator/simulator-chipyard.harness-${{ matrix.config }}
            sims/verilator/generated-src/chipyard.harness.TestHarness.${{ matrix.config }}/gen-collateral/
            demoriscv/software/Benchmark/build/*.elf
          retention-days: 7

  test:
    needs: build
    if: github.repository == 'nguyentienloc001/chipyard'
    runs-on: ubuntu-latest
    container:
      image: locnguyen96/chipyard-dev:latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config: [ThesisSoC, QuadCoreRing, QuadCoreMeshThesis]
        benchmark: [bench_matmul_scale, bench_pingpong, bench_mem_latency, bench_mem_bandwidth]
    steps:
      - uses: actions/checkout@v5
      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init submodules
        run: |
          git submodule update --init --depth=1 generators/ tools/

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-${{ matrix.config }}-${{ github.sha }}

      - name: Make simulator executable
        run: chmod +x sims/verilator/simulator-chipyard.harness-${{ matrix.config }}

      - name: Run ${{ matrix.benchmark }} on ${{ matrix.config }}
        run: |
          source /opt/chipyard-env.sh
          cd sims/verilator
          mkdir -p output/chipyard.harness.TestHarness.${{ matrix.config }}
          make SUB_PROJECT=chipyard CONFIG=${{ matrix.config }} \
            BINARY=$GITHUB_WORKSPACE/demoriscv/software/Benchmark/build/${{ matrix.benchmark }}.elf \
            TIMEOUT_CYCLES=500000000 run-binary

      - name: Show results
        if: always()
        run: |
          echo "=== ${{ matrix.benchmark }} on ${{ matrix.config }} ==="
          cat sims/verilator/output/chipyard.harness.TestHarness.${{ matrix.config }}/${{ matrix.benchmark }}.log 2>/dev/null || echo "No log file"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: result-${{ matrix.config }}-${{ matrix.benchmark }}-${{ github.sha }}
          path: |
            sims/verilator/output/chipyard.harness.TestHarness.${{ matrix.config }}/${{ matrix.benchmark }}.*
          retention-days: 30
